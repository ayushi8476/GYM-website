<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie-edge">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Black+Ops+One&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <title>Fitness Freaks</title>

    <style>
        body {
            margin: 0px;
            padding: 0px;
            background: url('https://images.unsplash.com/photo-1574680096145-d05b474e2155?q=80&w=869&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') center / cover no-repeat;
            min-height: 100vh;
            color: white;
            font-family: "Bebas Neue", sans-serif;
        }

        .left {
            display: inline-block;
            position: absolute;
            left: 60px;
            top: 18px;

        }

        .left img {
            width: 14vh;
            padding-bottom: 30px;
            filter: invert();
        }

        .left div {
            line-height: 20px;
            text-align: center;
            font-size: 25px;
        }

        .mid {
            display: flex;
            justify-content: center;

        }

        .navbar li {
            list-style: none;
            display: inline-block;
            font-size: 35px;

        }

        .navbar li a {
            text-decoration: none;
            color: white;
            padding: 30px;
        }

        .navbar li a:hover,
        .navbar li a:active {
            text-decoration: underline;
            color: gray;
        }

        .right {
            display: inline-block;
            position: absolute;
            right: 30px;
            top: 18px;
        }

        .btn {
            font-family: "Bebas Neue", sans-serif;
            margin: 0px 9px;
            padding: 10px 25px;
            font-size: 23px;
            border-radius: 10px;
            background-color: black;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(169, 169, 169, 0.356);
        }

        .container {
            display: block;
            align-items: center;
            margin: 200px auto;
            width: 50%;
            border-radius: 20px;
        }



        .container h1 {
            text-align: center;
            font-size: 90px;
            font-family: "Bebas Neue", sans-serif;
        }

        .form-group input {
            display: block;
            width: 508px;
            margin: 30px auto;
            padding: 20px;
            font-size: 30px;
            text-align: center;
            background: rgba(255, 235, 205, 0.678);
            border: 2px solid black;
            border-radius: 20px;
            font-family: "Bebas Neue", sans-serif;

        }

        .container button {
            display: block;
            width: 525px;
            margin: 10px auto;
            font-family: "Bebas Neue", sans-serif;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="left">
            <img src="https://t4.ftcdn.net/jpg/03/21/85/01/360_F_321850120_neqjiGGo0GS2EFCcvctV9xjw9dPrA9Un.jpg" alt=""
                width="140px" height="80px">
            <div>Fitness Freak</div>
        </div>
        <div class="mid">
            <ul class="navbar">

                <li><a href="#">Home</a></li>
                <li><a href="#">About us</a></li>
                <li><a href="#">Fitness Calculate</a></li>
                <li><a href="#">Contact us</a></li>

            </ul>
        </div>
        <div class="right">
            <button class="btn">Call us</button>
            <button class="btn">Email us</button>
        </div>
    </header>
    <div class="container">
        <h1>Join Our GYM</h1>
        <form action="">
            <div class="form-group">
                <input type="text" name="" placeholder="Enter Your Name">

            </div>
            <div class="form-group">
                <input type="number" name="" placeholder="Enter Your Age">

            </div>
            <div class="form-group">
                <input type="text" name="" placeholder="Enter Your Gender">

            </div>
            <div class="form-group">
                <input type="text" name="" placeholder="Enter Your Locality">

            </div>
            <button class="btn"> Submit</button>
        </form>
    </div>


</body>

</html>
